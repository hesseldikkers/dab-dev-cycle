bundle:
  name: orders

include:
  - resources/*.yml

artifacts:
  orders_wheel:
    type: whl
    build: uv build --wheel

variables:
  catalog:
    default: workspace

  schema:
    default: orders_dev

  warehouse_id:
    lookup:
      warehouse: Serverless Starter Warehouse

targets:
  dev:
    default: true
    mode: development
