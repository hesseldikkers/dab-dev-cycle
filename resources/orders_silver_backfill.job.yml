resources:
  jobs:
    orders_silver_backfill:
      name: orders_silver_backfill

      tags:
        owner: orders-team
        layer: silver

      job_clusters:
        - job_cluster_key: default
          new_cluster:
            spark_version: 18.2.x-scala2.13
            node_type_id: Standard_D4ds_v5
            data_security_mode: SINGLE_USER
            autoscale:
              min_workers: 2
              max_workers: 4

      tasks:
        - task_key: standardize
          job_cluster_key: default
          python_wheel_task:
            package_name: orders
            entry_point: silver
            named_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
          libraries:
            - whl: ../dist/*.whl
