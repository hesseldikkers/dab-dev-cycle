[project]
name = "orders"
version = "0.1.0"
description = "Medallion example bundle: orders"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
bronze = "orders.bronze:main"
silver = "orders.silver:main"

[dependency-groups]
dev = [
    "pyspark>=4.1,<4.2",
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orders"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 79
