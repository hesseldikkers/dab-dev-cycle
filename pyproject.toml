[project]
name = "orders"
version = "0.1.0"
description = "Medallion example bundle: orders"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
bronze = "orders.bronze:main"
silver = "orders.silver:main"

[dependency-groups]
dev = [
    "databricks-bundles>=1.23.0",
    "delta-spark>=4.4.1",
    "prek>=0.5.9",
    "pyspark>=4.1,<4.2",
    "pytest",
    "pytest-cov>=7.1.0",
    "ruff",
    "sqlfluff>=4.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orders"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov --cov-report=term-missing"

[tool.coverage.run]
source = ["orders", "mutators"]

[tool.ruff]
line-length = 79
extend-exclude = ["snippets"]

[tool.sqlfluff.core]
dialect = "databricks"
templater = "placeholder"

[tool.sqlfluff.indentation]
tab_space_size = 2

[tool.sqlfluff.templater.placeholder]
param_style = "colon"
catalog = "workspace"
schema = "orders_dev"
