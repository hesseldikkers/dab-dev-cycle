name: deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

# Written for a full account. Free Edition rejects the classic
# backfill job, so this workflow has not been run there.
jobs:
  acc:
    runs-on: ubuntu-latest
    environment: acc
    permissions:
      contents: read
      id-token: write
    env:
      DATABRICKS_AUTH_TYPE: github-oidc
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.DEPLOY_SP_ID }}
      BUNDLE_VAR_deploy_sp: ${{ vars.DEPLOY_SP_ID }}
      BUNDLE_VAR_run_as_sp: ${{ vars.RUN_AS_SP_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3

      - run: uv sync --locked

      - uses: databricks/setup-cli@v1.23.0

      - run: databricks bundle deploy -t acc

  prd:
    needs: acc
    runs-on: ubuntu-latest
    environment: prd
    permissions:
      contents: read
      id-token: write
    env:
      DATABRICKS_AUTH_TYPE: github-oidc
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.DEPLOY_SP_ID }}
      BUNDLE_VAR_deploy_sp: ${{ vars.DEPLOY_SP_ID }}
      BUNDLE_VAR_run_as_sp: ${{ vars.RUN_AS_SP_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3

      - run: uv sync --locked

      - uses: databricks/setup-cli@v1.23.0

      - run: databricks bundle deploy -t prd
