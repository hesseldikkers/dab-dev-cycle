name: ci

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - run: uv sync --locked

      - run: uv run prek run --all-files

      - run: uv run pytest

  bundle:
    needs: check
    if: vars.DATABRICKS_HOST != ''
    runs-on: ubuntu-latest
    environment: acc
    permissions:
      contents: read
      id-token: write
    env:
      DATABRICKS_AUTH_TYPE: github-oidc
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.DEPLOY_SP_ID }}
      BUNDLE_VAR_deploy_sp: ${{ vars.DEPLOY_SP_ID }}
      BUNDLE_VAR_run_as_sp: ${{ vars.RUN_AS_SP_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3

      - run: uv sync --locked

      - uses: databricks/setup-cli@v1.23.0

      - run: databricks bundle validate --strict -t acc
        working-directory: platform

      - run: databricks bundle plan -t acc | tee ../plan-platform-acc.txt
        working-directory: platform

      - run: databricks bundle validate --strict -t acc

      - run: databricks bundle plan -t acc | tee plan-acc.txt

      - uses: actions/upload-artifact@v7
        with:
          name: plan-acc
          path: |
            plan-platform-acc.txt
            plan-acc.txt
